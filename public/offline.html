<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sin conexión — Aviva LMS</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f6f7f6;
      color: #14231d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
    }
    .card {
      max-width: 380px;
      background: #fff;
      border: 1px solid #e3e8e5;
      border-radius: 20px;
      padding: 32px 24px;
    }
    .icon {
      width: 64px; height: 64px;
      margin: 0 auto 20px;
      border-radius: 18px;
      overflow: hidden;
    }
    .icon img { width: 100%; height: 100%; display: block; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 14px; line-height: 1.55; color: #5b665f; margin: 0 0 20px; }
    button {
      font: inherit;
      font-weight: 600;
      font-size: 14px;
      color: #fff;
      background: #16b877;
      border: 0;
      border-radius: 12px;
      padding: 12px 24px;
      cursor: pointer;
    }
    button:hover { background: #12a065; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <!-- Logo real de marca (el mismo archivo que precachea el service worker) -->
      <img src="/icons/icon-192.png" alt="Aviva" width="64" height="64" />
    </div>
    <h1>Sin conexión</h1>
    <p>
      No pudimos cargar esta pantalla porque no hay internet. Tu progreso guardado
      está a salvo — vuelve a intentar cuando tengas señal.
    </p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
