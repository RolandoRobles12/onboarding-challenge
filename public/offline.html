<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sin conexión — Aviva LMS</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f6f7f6;
      color: #14231d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
    }
    .card {
      max-width: 380px;
      background: #fff;
      border: 1px solid #e3e8e5;
      border-radius: 20px;
      padding: 32px 24px;
    }
    .icon {
      width: 64px; height: 64px;
      margin: 0 auto 20px;
      border-radius: 18px;
      background: #074739;
      display: flex; align-items: center; justify-content: center;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 14px; line-height: 1.55; color: #5b665f; margin: 0 0 20px; }
    button {
      font: inherit;
      font-weight: 600;
      font-size: 14px;
      color: #fff;
      background: #16b877;
      border: 0;
      border-radius: 12px;
      padding: 12px 24px;
      cursor: pointer;
    }
    button:hover { background: #12a065; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="34" height="34" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="30" height="38" rx="15" fill="#B0F5CD"/>
        <rect x="4" y="4" width="24" height="32" rx="12" fill="#16B877"/>
        <rect x="8" y="8" width="16" height="24" rx="8" fill="#FFFFFF"/>
        <rect x="11" y="11" width="10" height="18" rx="5" fill="#026149"/>
        <circle cx="16" cy="16.5" r="1.8" fill="#FFFFFF"/>
      </svg>
    </div>
    <h1>Sin conexión</h1>
    <p>
      No pudimos cargar esta pantalla porque no hay internet. Tu progreso guardado
      está a salvo — vuelve a intentar cuando tengas señal.
    </p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
